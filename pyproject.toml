[project]
name = "talora-v2"
version = "0.1.0"
description = "Intelligent job matching platform with evidence-based resume analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "groq>=0.4.0",
    "google-generativeai>=0.3.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "faiss-cpu>=1.7.0",
    "numpy>=1.24.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pypdf>=3.0.0",
    "requests>=2.31.0",
    "pypdf2>=3.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "job_pipeline", "match_engine"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.4",
]
